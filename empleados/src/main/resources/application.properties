spring.application.name=empleados
spring.datasource.url=jdbc:postgresql://localhost:5432/empleados_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true 

# Configuracion para jsp
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Cambiar el context path de la app
sever.servlet.context-path=/empleados
# localhost:8080/empleados

# Cambiar el puerto
# server.port=8081